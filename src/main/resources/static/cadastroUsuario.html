
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de usuario - MikroTik Manager</title>

    <link rel="stylesheet" href="css/painel.css">
</head>

<body>

    <header class="cabecalho">
        <div class="marca">
            <img src="img/logo.jpeg" alt="Logo MikroTik Manager" class="logo">
        </div>
    </header>

    <main class="conteudo">

        <section class="titulo">
            <h2>Cadastrar usuário</h2>
            <p>Cadastre um novo usuário para o Hotspot.</p>
        </section>

        <section class="formulario-cadastro">

            <form id="formCadastro">

                <div class="campo">
                    <input type="text" id="usuario" name="usuario"
                        placeholder="Crie um nome de usuário" required>
                </div>

                <div class="campo">
                    <input type="text" id="confirmar-usuario"
                        name="confirmar-usuario"
                        placeholder="Confirme o nome de usuário" required>
                </div>

                <div class="campo">
                    <input type="password" id="senha" name="senha"
                        placeholder="Crie uma senha" required>
                </div>

                <div class="campo">
                    <input type="password" id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Confirme a senha" required>
                </div>

                <p id="mensagem" role="status"></p>

                <div class="acoes-cadastro">
                    <a href="painel.html" class="voltar">Voltar</a>

                    <button type="submit" class="botao-cadastrar"
                        id="botaoCadastrar">
                        Cadastrar
                    </button>
                </div>

            </form>

        </section>

    </main>

    <script src="js/cadastroUsuario.js"></script>

</body>
</html>
